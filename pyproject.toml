[project]
name = "chip-detection"
version = "1.0.0"
description = "LM393 Sensor Module PCB & 3-Pin Anomaly Detection System (PatchCore + Geometric Pin Inspector)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
